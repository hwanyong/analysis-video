    { name = "imagehash", specifier = ">=4.3" },
    { name = "matplotlib", marker = "extra == 'viz'", specifier = ">=3.9" },
    { name = "mlx-whisper", marker = "platform_machine == 'arm64' and sys_platform == 'darwin'", specifier = ">=0.4" },
    { name = "numpy", specifier = ">=1.26" },
    { name = "nvidia-cublas-cu12", marker = "sys_platform != 'darwin' and extra == 'cuda'" },
    { name = "nvidia-cudnn-cu12", marker = "sys_platform != 'darwin' and extra == 'cuda'", specifier = ">=9" },
    { name = "pillow", specifier = ">=10" },
    { name = "scenedetect", extras = ["opencv-headless"], specifier = ">=0.6.4,<0.7" },
    { name = "scikit-image", specifier = ">=0.24" },
]
provides-extras = ["viz", "stt-fwhisper", "cuda"]

[package.metadata.requires-dev]
dev = [
    { name = "faster-whisper", specifier = ">=1.0" },
    { name = "matplotlib", specifier = ">=3.9" },
