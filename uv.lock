version = 1
revision = 3
requires-python = ">=3.11"
resolution-markers = [
    "python_full_version >= '3.12'",
    "python_full_version < '3.12'",
]

[manifest]
members = [
    "analysis-video",
    "analysis-video-gui",
]
overrides = [{ name = "torch", marker = "sys_platform == 'never'" }]

[manifest.dependency-groups]
dev = [{ name = "pytest", specifier = ">=8.0" }]

[[package]]
name = "analysis-video"
version = "0.1.0"
source = { editable = "packages/core" }
dependencies = [
    { name = "av" },
    { name = "faster-whisper", marker = "(platform_machine != 'ARM64' and sys_platform == 'win32') or sys_platform == 'linux'" },
    { name = "imagehash" },
    { name = "mlx-whisper", marker = "platform_machine == 'arm64' and sys_platform == 'darwin'" },
    { name = "numpy" },
    { name = "pillow" },
    { name = "scenedetect", extra = ["opencv-headless"] },
    { name = "scikit-image" },
]

[package.optional-dependencies]
cuda = [
    { name = "nvidia-cublas-cu12", marker = "sys_platform != 'darwin'" },
    { name = "nvidia-cudnn-cu12", marker = "sys_platform != 'darwin'" },
]
stt-fwhisper = [
    { name = "faster-whisper" },
]
viz = [
    { name = "matplotlib" },
]

[package.dev-dependencies]
dev = [
    { name = "faster-whisper" },
    { name = "matplotlib" },
]

[package.metadata]
requires-dist = [
    { name = "av", specifier = ">=13" },
    { name = "faster-whisper", marker = "(platform_machine != 'ARM64' and sys_platform == 'win32') or sys_platform == 'linux'", specifier = ">=1.0" },
