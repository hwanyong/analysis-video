[project]
name = "analysis-video"
version = "0.1.0"
description = "슬라이드 기반 강의 영상을 AI 소비용 컨텍스트(프레임 이미지 + 대사 타임라인 + 메타데이터 JSON)로 변환하는 에이전트 친화 CLI"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "av>=13",
    # 0.7부터 opencv-python(GUI판)이 하드 의존으로 바뀜 — headless extra가 있는 0.6.x 고정.
    # pip 최종 사용자에게도 headless만 설치되게 하는 유일한 선언적 방법 (결정 A10)
    "scenedetect[opencv-headless]>=0.6.4,<0.7",
    "scikit-image>=0.24",
    "Pillow>=10",
    # STT 백엔드 — 플랫폼별 자동 선택 (1순위 macOS Apple Silicon = MLX/Metal).
    # faster-whisper는 휠이 실존하는 조합에만 강제: Intel Mac(onnxruntime x86_64 휠 중단)과
    # Windows ARM64(ctranslate2 휠 부재)는 설치 실패 대신 doctor(exit 4) 안내로 처리
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; sys_platform == 'linux' or (sys_platform == 'win32' and platform_machine != 'ARM64')",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9"]
# Apple Silicon에서도 faster-whisper 폴백을 강제 설치하고 싶을 때 (교차검증·비교용)
stt-fwhisper = ["faster-whisper>=1.0"]
# NVIDIA GPU: 시스템 CUDA 설치 없이 pip만으로 런타임 구성 (드라이버만 필요)
cuda = [
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9; sys_platform != 'darwin'",
]

[project.scripts]
analysis-video = "analysis_video.cli:main"

[dependency-groups]
dev = [
    "faster-whisper>=1.0",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_video"]
