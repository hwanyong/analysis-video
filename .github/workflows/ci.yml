name: ci

# 이 워크플로는 "개발자의 고정된 조합"을 검증한다(uv.lock 기준).
# 최종 사용자가 겪는 버전 계산은 여기서 절대 드러나지 않으므로
# install-smoke.yml 이 별 잡으로 존재한다 — 합치지 말 것.
#
# 액션 핀 규칙: 공식 액션은 이동하는 메이저 태그(@v7 등)로 핀한다. 다만
# astral-sh/setup-uv 는 **v8부터 메이저 태그를 내지 않는다**(refs/tags/v7 까지만
# 존재하고 v8·v9·v10 은 없다 — 있는 것은 v10.0.0 같은 전체 버전뿐). 그래서
# 그 액션만 전체 버전으로 핀하고 사람이 손으로 올린다. 세 워크플로가 같은 값을
# 쓰므로 올릴 때 셋을 함께 고칠 것.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          # macOS + 3.14 는 STT 백엔드 휠이 없다(mlx는 cp313까지, onnxruntime는
          # macOS cp314 부재). STT 가 [stt] extra 로 내려간 뒤에도 이 잡은 여전히
          # 서지 못한다 — dev 그룹이 `analysis-video[stt,stt-fwhisper,viz]` 를
          # 켜는데 [stt-fwhisper] 의 faster-whisper 에는 마커가 없어서
          # uv sync 가 그 자리에서 해석에 실패한다(실측: onnxruntime cp314 부재).
          # 최종 사용자의 기대 동작은 "설치는 되고 STT 만 없음"이고, 그쪽은
          # install-smoke.yml 의 두 축(extra 없음 · [stt])이 검증한다.
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: sync
        run: uv sync --python ${{ matrix.python }}
      - name: 코어 테스트 (네트워크 불필요)
        run: uv run --python ${{ matrix.python }} pytest packages/core/tests -q

  gui:
    name: gui · ubuntu · py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: Qt 런타임 의존 (offscreen 렌더·오디오)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libdbus-1-3 libportaudio2
      # GUI 테스트의 'analyzed' 픽스처가 실제 transcribe를 돌려 HuggingFace에서
      # 가중치를 받는다(tiny 약 74MB). 캐시가 없으면 매 실행마다 내려온다.
      - name: 모델 가중치 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-${{ runner.os }}
      - run: uv sync --python 3.12
      - name: GUI 테스트 (headless — conftest가 QT_QPA_PLATFORM=offscreen 설정)
        run: uv run --python 3.12 pytest packages/gui/tests -q

  changelog:
    # release.yml 이 태그를 받을 때 하는 검사를 여기서 미리 한다. 릴리스 노트의
    # 재료가 없다는 것을 그날 처음 알면, 되돌릴 수 없는 업로드 직전에 멈춰 선다.
    # 검사 규칙은 .github/scripts/changelog_section.py 한 곳에 있다 —
    # 이 잡과 release.yml 이 같은 파일을 부른다.
    name: CHANGELOG 에 각 패키지의 현재 버전 절이 있는가
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 대조
        run: |
          set -euo pipefail
          for dir in packages/core packages/gui; do
            meta=$(python3 -c \
              "import sys,tomllib;p=tomllib.load(open(sys.argv[1]+'/pyproject.toml','rb'))['project'];print(p['name'],p['version'])" \
              "$dir")
            dist="${meta% *}"; version="${meta#* }"
            python3 .github/scripts/changelog_section.py "$dist" "$version" >/dev/null
            echo "ok: $dist $version"
          done

  skill-sync:
    # 저장소 루트의 SKILL.md 는 **생성물**이다. 정본은
    # packages/core/src/analysis_video/skill.py 의 템플릿이고, 루트 파일은
    # 에이전트가 GitHub에서 이 도구를 발견하는 경로(발견 채널)일 뿐이다.
    # 손으로 고칠 수 있는 자리에 사본을 두면 두 문서가 서로 다른 기본값을
    # 주장하게 된다 — skill.py 머리말이 적은 그 사고를 여기서 막는다.
    name: 루트 SKILL.md 가 생성 결과와 같은가
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: 대조
        run: |
          set -euo pipefail
          if [ ! -f SKILL.md ]; then
            echo "::error file=SKILL.md::저장소 루트에 SKILL.md 가 없습니다. 정본은 packages/core/src/analysis_video/skill.py 이고 루트 파일은 그 생성물입니다. 아래 명령이 만든 파일을 저장소 루트에 두세요."
            echo "  uv run --package analysis-video analysis-video install-skill --dir \"\$(mktemp -d)\""
            exit 1
          fi
          # 생성 경로를 여기서 조립하지 않는다 — install-skill 이 쓴 자리를
          # 그 출력(JSON)에서 그대로 받는다.
          generated=$(uv run --package analysis-video analysis-video \
                        install-skill --dir "$RUNNER_TEMP/skill-check" | jq -r .path)
          if ! diff -u "$generated" SKILL.md; then
            echo "::error file=SKILL.md::루트 SKILL.md 가 render_skill() 결과와 다릅니다(-: 생성 결과, +: 저장소 파일). 이 파일을 손으로 고치지 마세요 — 문안은 packages/core/src/analysis_video/skill.py 에서 고치고, 루트 파일은 'uv run --package analysis-video analysis-video install-skill --dir \"\$(mktemp -d)\"' 가 만든 것으로 덮으세요."
            exit 1
          fi
          echo "ok: 루트 SKILL.md 가 생성 결과와 같습니다"
