name: deploy

# 랜딩 페이지를 https://lab.hwanyong.com/analysis-video/ 로 배포한다.
#
# ★ 한때 GitHub Pages 로도 나갔다(blog.hwanyong.com/analysis-video/). 2026-08-25 에 그 잡을
#   지웠다 — 그 도메인은 이제 Cloudflare 가 서빙하고, 옛 경로는 Worker 가 lab 으로
#   301 한다. Pages 로 올려 봐야 아무도 읽지 않는 산출물이었다.
#   저장소 설정의 Pages 도 같은 날 껐다.
#
# ★ 되돌릴 곳이 없다. 이 잡이 실패하면 사이트는 ★직전 배포에 머문다★ —
#   내려가지는 않지만 새 내용이 나가지 않는다. 실패를 방치하면 조용히 낡는다.
#
# 액션 핀 규칙은 ci.yml 과 같다 — 공식 액션은 이동하는 메이저 태그로 핀한다.

on:
  push:
    branches: [main]
    # 랜딩과 무관한 커밋마다 재배포하지 않는다. pyproject.toml 이 목록에 있는 이유는
    # 구조화 데이터의 softwareVersion 을 build.py 가 거기서 읽어 오기 때문이다 —
    # 릴리스로 버전이 오르면 랜딩도 따라 올라야 한다.
    paths:
      - 'site/**'
      - 'docs/media/**'
      - 'packages/core/pyproject.toml'
      - '.github/workflows/pages.yml'
      - 'cloudflare/**'
  workflow_dispatch:

# 저장소를 읽는 것뿐이다. Pages 잡을 지우면서 그 잡이 쓰던 쓰기 권한도 함께 걷었다 —
# 쓰지 않는 쓰기 권한을 남겨 두면 워크플로를 뺏겼을 때 넘겨줄 것이 그만큼 늘어난다.
permissions:
  contents: read

# 배포는 취소하지 않는다. 밀어내기가 연달아 들어와도 진행 중인 배포를 끊으면
# 중간 상태로 남을 수 있다 — 뒤엣것이 큐에서 기다리는 편이 낫다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # site/build.py 는 표준 라이브러리만 쓴다(tomllib 때문에 3.11 이상).
      # uv sync 가 필요 없으므로 워크스페이스 전체를 세우지 않는다.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: build
        run: python site/build.py

      # ★ 한때 Pages 전용 업로드 액션이 여기 하나 더 있었다. 그것이 만드는 것은
      #   ★GitHub Pages 전용 형식★ 이라 Cloudflare 잡이 그대로 내려받을 수 없어
      #   일반 아티팩트를 한 벌 더 올려야 했다. Pages 를 버린 뒤로는 이 한 벌뿐이다.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # ── Cloudflare Workers (lab.hwanyong.com) ────────────────────────────────
  # ★이 잡이 유일한 배포다.★
  # ★ 선행 조건: 저장소 시크릿 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Arrange assets under the served path
        run: |
          mkdir -p out/analysis-video
          cp -R _site/. out/analysis-video/
          cp cloudflare/_headers out/_headers
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
